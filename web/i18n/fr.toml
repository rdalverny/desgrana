[situation]
heading = "La situation"
paragraphs = [
  "Quand une Behringer Wing ou X32 enregistre une session multipiste (via une carte W-Live ou X-Live), elle écrit un seul WAV multicanal entrelacé : un fichier, tous vos canaux.",
  "La plupart des DAW (Logic Pro, Pro Tools, Ableton Live) l'importent comme un simple fichier stéréo ; Reaper sait l'éclater en pistes séparées, mais elles ressortent numérotées et sans nom.",
  "Desgrana lit ce fichier, sépare chaque canal en une piste mono ou stéréo, récupère les noms de canaux depuis le snapshot de votre console, et dépose le tout dans un dossier que votre DAW peut charger immédiatement.",
]

[features]
heading = "Avec Desgrana"
items = [
  "Déposez le dossier de la session, cliquez : c'est prêt.",
  "Le son de chaque piste reste intact&nbsp;: pas de conversion, pas de rééchantillonnage.",
  "Les noms des pistes et les paires stéréo sont récupérés et appliqués automatiquement.",
  "Seules les pistes réellement enregistrées apparaissent.",
  "Les sessions longues sur plusieurs fichiers (de 4 Go) sont réarrangées en pistes continues.",
  "Les marqueurs de session sont également récupérés (chunks cue dans le WAV ou fichier MIDI).",
  "Ça fonctionne aussi avec n'importe quel autre WAV multipiste.",
]

